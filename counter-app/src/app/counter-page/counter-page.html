<div class="d-flex vh-100 justify-content-center align-items-center">
  <div class="card shadow-lg text-center p-5" style="min-width: 340px;">
    <h1 class="display-5 fw-bold mb-1 text-primary">Counter App</h1>
    <p class="account-number text-muted small mb-4">Account: {{ accountNumber }}</p>
    <p class="count display-1 fw-bold text-primary mb-4">{{ count }}</p>
    <div class="d-flex gap-3 justify-content-center">
      <button class="btn btn-primary btn-lg px-5" (click)="increment()">+ Increment</button>
      <button class="btn btn-outline-primary btn-lg px-5" (click)="decrement()" [disabled]="count === 0">− Decrement</button>
    </div>
  </div>
</div>
